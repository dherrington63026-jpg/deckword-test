<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6efe4">
<title>Deckword (test)</title>
<style>
:root{--bg:#f6efe4;--ink:#3b2f2a;--soft:#7a6a5d;--card:#fffaf2;--line:#d8c9b4;--acc:#e8735a;--ok:#4f9d8f;--fs:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;overscroll-behavior:none}
#app{max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px;gap:8px}
header h1{font-size:calc(19px*var(--fs));margin:0;font-weight:700;flex:1;text-align:center}
.pill{font-size:calc(14px*var(--fs));color:var(--soft);min-width:84px}
.pill.r{text-align:right}
button{font:inherit;color:inherit;cursor:pointer}
#bMenu{background:var(--card);border:2px solid var(--line);border-radius:12px;min-width:84px;height:42px;font-weight:600;font-size:calc(15px*var(--fs))}
.slots{display:grid;gap:8px;margin:2px 0 10px}
.slots.n3{grid-template-columns:repeat(3,1fr)}
.slots.n4{grid-template-columns:repeat(4,1fr)}
.slots.n5{grid-template-columns:repeat(6,1fr)}
.slots.n5 .slot{grid-column:span 2}
.slots.n5 .slot:nth-child(4){grid-column:2/span 2}
.slots.n5 .slot:nth-child(5){grid-column:4/span 2}
.slot{min-height:104px;border:3px dashed var(--c);border-radius:14px;background:rgba(255,255,255,.45);padding:6px 5px;text-align:center;overflow:hidden;transition:background .2s}
.slot.target{background:rgba(255,255,255,.9);border-style:solid}
.slot .sh{font-size:calc(12px*var(--fs));font-weight:700;color:var(--soft);margin-bottom:3px;text-transform:uppercase;letter-spacing:.02em}
.slot .sw{font-size:calc(14px*var(--fs));line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .sw.sel{background:var(--acc);color:#fff;border-radius:6px}
.slot.done{background:var(--c);border-style:solid;color:#fff}
.slot.done .sh{color:#fff;font-size:calc(14px*var(--fs));text-transform:none}
.slot.hint{animation:pulse 1s infinite}
.slot.shake{animation:shake .4s}
#cols{flex:1;overflow-y:auto;display:flex;gap:8px;align-items:flex-start;padding:2px 0 10px}
.col{display:flex;flex-direction:column;flex:none;min-height:70px}
.card{height:60px;margin-top:-30px;border:2px solid var(--line);border-radius:10px;background:var(--card);text-align:center;font-weight:600;line-height:30px;overflow:hidden;white-space:nowrap;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.card:first-child{margin-top:0}
.card.locked{color:#6b5d52;background:#efe5d4}
.card.play{box-shadow:0 3px 0 var(--line)}
.card.sel{background:var(--acc);border-color:#c95a42;color:#fff;transform:translateY(-4px)}
.card.hint{border-color:var(--ok);background:#e2f3ef;animation:pulse 1s infinite}
.empty{height:60px;border:2px dashed var(--line);border-radius:10px;color:var(--soft);font-size:13px;line-height:56px;text-align:center}
.bar{display:flex;gap:10px;padding:8px 0 12px}
.bar button{flex:1;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:calc(16px*var(--fs))}
.bar button:active{transform:translateY(2px)}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);max-width:88%;background:rgba(59,47,42,.94);color:#fff;padding:10px 16px;border-radius:12px;font-size:calc(15px*var(--fs));opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;z-index:5}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:rgba(59,47,42,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.on{display:flex}
.sheet{background:var(--bg);border-radius:20px;padding:20px;width:100%;max-width:440px;max-height:90dvh;overflow-y:auto;text-align:center}
.sheet h2{margin:0 0 8px;font-size:calc(24px*var(--fs))}
.sub{color:var(--soft);font-size:calc(15px*var(--fs));margin:4px 0 12px}
.stars{font-size:46px;color:#e8a92f;letter-spacing:4px}.stars span{color:#d8c9b4}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 14px}
.chip{color:#fff;border-radius:999px;padding:5px 12px;font-size:calc(14px*var(--fs));font-weight:600}
.row{display:flex;gap:10px;margin-top:10px}
.row button,.grid1 button{flex:1;min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:calc(16px*var(--fs));padding:8px}
button.pri{background:var(--acc);border-color:#c95a42;color:#fff}
.grid1{display:grid;gap:10px}
.grid1 small{display:block;font-weight:400;color:var(--soft);font-size:13px}
.fun{background:#fff;border-radius:14px;padding:10px;margin:8px 0}.fun p{margin:0 0 6px;font-weight:600}
.how{text-align:left;font-size:calc(16px*var(--fs));line-height:1.45;padding-left:22px;margin:8px 0}
.lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0}
.lv{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:6px 0;font-weight:700;font-size:calc(15px*var(--fs))}
.lv i{display:block;font-style:normal;font-size:11px;color:#e8a92f;height:14px}
.lv.cur{border-color:var(--acc)}
textarea{width:100%;height:230px;border-radius:10px;border:2px solid var(--line);padding:8px;font:13px/1.4 ui-monospace,Consolas,monospace;background:#fff}
.coach{display:none;background:#fff3d6;border:2px solid #e8a92f;border-radius:12px;padding:8px 12px;margin:0 0 8px;font-size:calc(16px*var(--fs));line-height:1.35;font-weight:600}
.coach.on{display:block}
.coach a{display:inline-block;margin-left:6px;font-weight:400;font-size:13px;color:var(--soft);text-decoration:underline;cursor:pointer}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
.slot.done .dot{border-color:#fff}
.card.c{border-color:rgba(0,0,0,.28);text-shadow:none}
.card.p{height:68px;margin-top:-30px;line-height:36px}
.card.p:first-child{margin-top:0}
.card.p .e{display:block;font-size:29px;line-height:38px}
.card.p .n{display:block;font-size:12px;line-height:18px;color:var(--soft);font-weight:600}
.card.p.sel .n{color:#fff}
.card.sel{outline:3px solid var(--acc);outline-offset:0}
.card.hint{outline:3px solid var(--ok)}
.sheet small{display:block;font-weight:400;color:var(--soft);font-size:13px;margin-top:2px}
.grid1 b{font-size:calc(18px*var(--fs))}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(79,157,143,.35)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="bMenu">☰ Menu</button>
    <h1 id="lvl">Level 1</h1>
    <div class="pill r" id="miss">Misses 0</div>
  </header>
  <div id="coach" class="coach"></div>
  <div id="slots" class="slots"></div>
  <div id="cols"></div>
  <div class="bar"><button id="bUndo">Undo</button><button id="bHint">Hint (3)</button><button id="bRestart">Restart</button></div>
</div>
<div id="toast"></div>
<div id="modal"></div>
<script src="bank.js"></script>
<script src="bank_colors.js"></script>
<script src="bank_pics.js"></script>
<script src="game.js"></script>
</body>
</html>
