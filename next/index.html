<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f7f0e6">
<link rel="icon" href="data:,">
<title>Alikeberry</title>
<style>
@font-face{font-family:'Nunito';font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/nunito.woff2) format('woff2')}
:root{
  --fs:1;
  --bg1:#fbf6ee;--bg2:#f0e4d2;--ink:#2d2433;--soft:#7d7288;--line:rgba(60,40,70,.12);
  --card:#ffffff;--card2:#f6efe6;--glass:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.85);
  --acc:#ff6b4a;--acc2:#ff9a5a;--ok:#14a58f;--shadow:0 1px 0 rgba(60,40,70,.06),0 10px 22px -12px rgba(60,40,70,.35);
  --blob1:#ffc9a8;--blob2:#ffe3a3;
}
body[data-mode=colors]{--bg1:#f8f5ff;--bg2:#e8dffa;--acc:#7a5af8;--acc2:#a98bff;--blob1:#d6c8ff;--blob2:#ffd1ec;--card2:#f1ecfb}
body[data-mode=pics]{--bg1:#f0fbf8;--bg2:#d9eee9;--acc:#0f9d8c;--acc2:#3ccfb8;--blob1:#b9efe3;--blob2:#cfe4ff;--card2:#e9f5f1}
body[data-mode=nums]{--bg1:#f1f7ff;--bg2:#dbe9fb;--acc:#2f7de1;--acc2:#58b6f0;--blob1:#bcd7ff;--blob2:#cdf1ff;--card2:#e8f0fb}
body[data-mode=decades]{--bg1:#fff6e8;--bg2:#f6dfba;--acc:#e0803a;--acc2:#f2b84e;--blob1:#ffd9a3;--blob2:#ffc7a8;--card2:#f7ecd9}
body[data-mode=wordplay]{--bg1:#fff1f6;--bg2:#f8d9e6;--acc:#d6458f;--acc2:#f58cb8;--blob1:#ffc4dc;--blob2:#e3d1ff;--card2:#fbe9f1}
body[data-mode=bible]{--bg1:#fbf7ec;--bg2:#ece0bf;--acc:#b8892a;--acc2:#e3c066;--blob1:#f2dfa5;--blob2:#d9e6f5;--card2:#f4eedb}
body[data-mode=foods]{--bg1:#fff4ee;--bg2:#f8d6c4;--acc:#d9482b;--acc2:#f58a5c;--blob1:#ffc9ae;--blob2:#ffe7a8;--card2:#fbe8de}
body[data-mode=states]{--bg1:#f0f4fb;--bg2:#d5e0f2;--acc:#3b5bb5;--acc2:#6f8fe0;--blob1:#c7d6f5;--blob2:#f5c9d1;--card2:#e6ecf7}
body[data-mode=mixed]{--bg1:#faf3ff;--bg2:#ead9f7;--acc:#8a45d6;--acc2:#e062a6;--blob1:#ddc4ff;--blob2:#ffc4e1;--card2:#f1e7fa}
body[data-mode=flowers]{--bg1:#fff3f8;--bg2:#f6d6e6;--acc:#d6457f;--acc2:#f28fb6;--blob1:#ffc6dd;--blob2:#d9f0c8;--card2:#fbe8f1}
body[data-mode=birds]{--bg1:#f0f8ff;--bg2:#d3e8f7;--acc:#2a8bbf;--acc2:#6fc7e8;--blob1:#bfe3f7;--blob2:#e8f3c9;--card2:#e5f1f9}
body[data-mode=places]{--bg1:#fdf6e9;--bg2:#ecd9b3;--acc:#1f7a8c;--acc2:#e0a458;--blob1:#c9e6e8;--blob2:#f2d49b;--card2:#f6ecd6}
@media (prefers-color-scheme:dark){
  :root{--bg1:#1b1623;--bg2:#120f19;--ink:#f4eefb;--soft:#a99fba;--line:rgba(255,255,255,.12);--card:#2b2536;--card2:#231e2d;--glass:rgba(255,255,255,.07);--glass-b:rgba(255,255,255,.14);--shadow:0 1px 0 rgba(0,0,0,.4),0 10px 22px -12px rgba(0,0,0,.7);--blob1:#4b2a3e;--blob2:#2c3d5a}
  body[data-mode=colors]{--bg1:#1c1730;--bg2:#120f22;--blob1:#3b2f78;--blob2:#5a2a55;--card2:#272040}
  body[data-mode=nums]{--bg1:#101a2b;--bg2:#0a111d;--blob1:#1d3f73;--blob2:#17506a;--card2:#1b2638}
  body[data-mode=decades]{--bg1:#2a1d12;--bg2:#1a110a;--blob1:#6a3a14;--blob2:#5b2a22;--card2:#2f2418}
  body[data-mode=wordplay]{--bg1:#2a1220;--bg2:#1a0a14;--blob1:#6b1f48;--blob2:#3b2a6b;--card2:#301a28}
  body[data-mode=bible]{--bg1:#241f12;--bg2:#17130a;--blob1:#5c4814;--blob2:#1d3552;--card2:#2c2616}
  body[data-mode=foods]{--bg1:#2b1712;--bg2:#1b0e0a;--blob1:#6b2a18;--blob2:#5b4416;--card2:#33201a}
  body[data-mode=states]{--bg1:#111a2e;--bg2:#0a101e;--blob1:#233c78;--blob2:#5a2336;--card2:#1b2538}
  body[data-mode=mixed]{--bg1:#22142e;--bg2:#150b1e;--blob1:#4d2a78;--blob2:#6b2a52;--card2:#2a1c38}
  body[data-mode=flowers]{--bg1:#2a1220;--bg2:#190a14;--blob1:#6b1f48;--blob2:#25502a;--card2:#301a28}
  body[data-mode=birds]{--bg1:#0f1c2b;--bg2:#09111b;--blob1:#1b4a6b;--blob2:#3b4d1a;--card2:#192636}
  body[data-mode=places]{--bg1:#241d10;--bg2:#17120a;--blob1:#1c4f58;--blob2:#5c4414;--card2:#2c2514}
  body[data-mode=pics]{--bg1:#10201f;--bg2:#0b1514;--blob1:#17524a;--blob2:#1b3a5c;--card2:#1b2b29}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ink);font-family:'Nunito',ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;overscroll-behavior:none;font-weight:600}
body{background:linear-gradient(165deg,var(--bg1),var(--bg2));background-attachment:fixed;transition:background .4s}
body::before,body::after{content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(60px);opacity:.7;pointer-events:none}
body::before{width:300px;height:300px;left:-90px;top:-70px;background:var(--blob1)}
body::after{width:340px;height:340px;right:-120px;bottom:-60px;background:var(--blob2)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{position:relative;z-index:1;max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 6px) 14px calc(env(safe-area-inset-bottom) + 8px)}

/* header */
.top{display:grid;grid-template-columns:48px 1fr 74px;align-items:center;gap:8px;padding:2px 0 10px}
.ib{width:46px;height:46px;border-radius:16px;background:var(--glass-b);box-shadow:var(--shadow);display:grid;place-items:center;backdrop-filter:blur(10px)}
.ib svg,.bar svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.title{text-align:center;line-height:1.1}
#modeTag{font-size:calc(11px*var(--fs));font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
#lvl{margin:2px 0 0;font-size:calc(22px*var(--fs));font-weight:900;letter-spacing:-.01em}
#dots{display:flex;gap:5px;justify-content:center;margin-top:5px;min-height:8px}
#dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:all .3s}
#dots i.on{background:var(--acc);transform:scale(1.25)}
.meter{text-align:right}
#stars{display:flex;gap:1px;justify-content:flex-end}
#stars svg{width:17px;height:17px;fill:#f6b73c;stroke:none;transition:all .25s}
#stars svg.off{fill:var(--line)}
#miss{font-size:calc(12px*var(--fs));color:var(--soft);margin-top:2px;font-weight:700}

/* coach */
.coach{display:none;background:linear-gradient(135deg,#fff4d9,#ffe9c4);color:#4a3412;border-radius:18px;padding:11px 14px;margin:0 0 10px;font-size:calc(16px*var(--fs));line-height:1.35;font-weight:800;box-shadow:var(--shadow)}
.coach.on{display:block}
.coach a{display:inline-block;margin-left:6px;font-weight:600;font-size:13px;opacity:.7;text-decoration:underline;cursor:pointer}

/* group boxes */
.slots{display:grid;gap:9px;margin:0 0 12px}
.slots.n3{grid-template-columns:repeat(3,1fr)}
.slots.n4{grid-template-columns:repeat(4,1fr)}
.slots.n5{grid-template-columns:repeat(6,1fr)}
.slots.n5 .slot{grid-column:span 2}
.slots.n5 .slot:nth-child(4){grid-column:2/span 2}
.slots.n5 .slot:nth-child(5){grid-column:4/span 2}
.slot{position:relative;min-height:108px;border-radius:20px;background:var(--glass);border:2px dashed var(--line);padding:9px 6px;text-align:center;overflow:hidden;transition:background .25s,border-color .25s,transform .25s,box-shadow .25s;backdrop-filter:blur(8px)}
.slot::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--c1),var(--c2));opacity:0;transition:opacity .25s}
.slot.started{border-style:solid;border-color:transparent;background:var(--glass-b);box-shadow:var(--shadow)}
.slot.started::before{opacity:1}
.slot.target{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
.slot .sh{font-size:calc(12px*var(--fs));font-weight:900;color:var(--soft);letter-spacing:.06em;text-transform:uppercase;margin:3px 0 4px}
.slot.empty .sh{margin-top:30px;opacity:.7}
.slot .sw{font-size:calc(14px*var(--fs));line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.slot .sw.sel{background:var(--acc);color:#fff;border-radius:8px}
.slot .sw img{width:22px;height:22px;object-fit:contain;vertical-align:-6px;margin-right:4px;background:#fff;border-radius:6px}
.slot.done{background:linear-gradient(150deg,var(--c1),var(--c2));border:0;color:#fff;box-shadow:0 12px 24px -12px var(--c1)}
.slot.done::before{display:none}
.slot.done .sh{color:#fff;font-size:calc(15px*var(--fs));letter-spacing:0;text-transform:none;font-weight:900}
.slot.done .sw{color:rgba(255,255,255,.92);font-weight:700}
.slot.done .sw img{background:rgba(255,255,255,.9);border-radius:6px;mix-blend-mode:normal}
.slot.done .ck{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.3);display:grid;place-items:center;margin:2px auto 5px}
.slot.done .ck svg{width:12px;height:12px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.slot.hint{animation:pulse 1s infinite}
.slot.shake{animation:shake .4s}
.slot.bump{animation:bump .35s}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
.slot.done .dot{border-color:#fff}

/* columns and cards */
#cols{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;gap:9px;align-items:flex-start;padding:4px 0 12px;scrollbar-width:none}
#cols::-webkit-scrollbar{display:none}
.col{display:flex;flex-direction:column;flex:none;min-height:72px}
.card{position:relative;height:64px;margin-top:-32px;border-radius:16px;background:var(--card);box-shadow:0 1px 0 rgba(0,0,0,.05),0 6px 12px -8px rgba(60,40,70,.45);text-align:center;font-weight:800;line-height:32px;overflow:hidden;white-space:nowrap;transition:transform .18s,box-shadow .18s,background .18s}
.card:first-child{margin-top:0}
.card.locked{background:color-mix(in srgb,var(--card) 62%,transparent);color:var(--soft);box-shadow:inset 0 0 0 1.5px var(--line),0 4px 8px -6px rgba(60,40,70,.4)}
.card.play{box-shadow:0 1px 0 rgba(0,0,0,.05),0 10px 18px -8px rgba(60,40,70,.55);border-bottom:3px solid color-mix(in srgb,var(--acc) 55%,transparent)}
.card.sel{background:linear-gradient(145deg,var(--acc),var(--acc2));color:#fff;transform:translateY(-6px) scale(1.04);z-index:3;box-shadow:0 16px 26px -10px var(--acc);border-bottom-color:transparent}
.card.hint{outline:3px solid var(--ok);outline-offset:1px;animation:pulse 1s infinite;z-index:2}
.card.c{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35),0 6px 12px -8px rgba(0,0,0,.5);text-shadow:0 1px 0 rgba(0,0,0,.12)}
.card.c::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%);pointer-events:none}
.card.c.locked{color:inherit}
.card.c.sel{outline:3px solid #fff;box-shadow:0 0 0 5px var(--acc),0 14px 26px -8px rgba(0,0,0,.5)}
.card.p{height:86px;margin-top:-30px;line-height:1;padding-top:4px}
.card.p:first-child{margin-top:0}
.card.p{background:#fff;color:#2d2433}
.card.p.locked{background:#fff;filter:brightness(.955);box-shadow:inset 0 0 0 1.5px rgba(60,40,70,.14),0 4px 8px -6px rgba(60,40,70,.4)}
.card.p.locked .n{visibility:hidden}
.card.p.sel{background:#fff;color:#2d2433;outline:3px solid var(--acc);box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 25%,transparent),0 14px 24px -10px var(--acc)}
.card.p img{display:block;width:50px;height:50px;object-fit:contain;margin:0 auto}
.card.p .n{display:block;font-size:calc(12px*var(--fs));line-height:1;margin-top:5px;color:var(--soft);font-weight:800}
.card.p.sel .n{color:var(--acc)}
.empty{height:64px;border:2px dashed var(--line);border-radius:16px;color:var(--soft);font-size:12px;line-height:1.15;display:grid;place-items:center;text-align:center;font-weight:800;padding:4px}

/* bottom bar */
.bar{display:flex;gap:10px;padding:8px 0 4px}
.bar button{position:relative;flex:1;height:58px;border-radius:20px;background:var(--glass-b);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:calc(13px*var(--fs));font-weight:800;backdrop-filter:blur(10px);transition:transform .12s}
.bar button:active{transform:scale(.95)}
.bar svg{width:22px;height:22px}
#hintBadge{position:absolute;top:5px;right:calc(50% - 30px);min-width:20px;height:20px;border-radius:10px;background:linear-gradient(145deg,var(--acc),var(--acc2));color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 5px}

/* toast */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translate(-50%,-10px);max-width:90%;background:rgba(35,28,42,.94);color:#fff;padding:10px 18px;border-radius:999px;font-size:calc(15px*var(--fs));font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center;z-index:30;backdrop-filter:blur(8px)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* sheets */
#modal{position:fixed;inset:0;background:rgba(25,18,34,.5);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex;animation:fade .2s}
.sheet{position:relative;background:var(--bg1);color:var(--ink);border-radius:32px 32px 0 0;padding:26px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;text-align:center;animation:rise .32s cubic-bezier(.2,.9,.25,1);box-shadow:0 -20px 50px -20px rgba(0,0,0,.4)}
.sheet::before{content:"";position:absolute;top:9px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:var(--line)}
.sheet h2{margin:6px 0 4px;font-size:calc(26px*var(--fs));font-weight:900;letter-spacing:-.01em}
.sub{color:var(--soft);font-size:calc(15px*var(--fs));margin:4px 0 14px;font-weight:700;line-height:1.4}
.sheet small{display:block;font-weight:700;color:var(--soft);font-size:calc(13px*var(--fs));margin-top:2px}
.grid1{display:grid;gap:10px;margin-top:8px}
.tile,.row button,.grid1>button{min-height:56px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:calc(16px*var(--fs));padding:10px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .1s}
.tile:active,.row button:active,.grid1>button:active{transform:scale(.97)}
button.pri{background:linear-gradient(145deg,var(--acc),var(--acc2))!important;color:#fff!important;box-shadow:0 12px 22px -10px var(--acc)!important}
button.pri small{color:rgba(255,255,255,.85)}
.row{display:flex;gap:10px;margin-top:12px}
.row button{flex:1}
.mt{display:flex!important;flex-direction:row!important;gap:14px;text-align:left;align-items:center!important;justify-content:flex-start!important;padding:12px 16px!important}
.mt .mi{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:22px;font-weight:900;color:#fff}
.mt .mi.w{background:linear-gradient(145deg,#ff6b4a,#ff9a5a)}
.mt .mi.c{background:conic-gradient(from 20deg,#ff4d6d,#ffb703,#2dd4a8,#4d8cff,#a855f7,#ff4d6d)}
.mt .mi.p{background:linear-gradient(145deg,#0f9d8c,#3ccfb8)}
.mt b{display:block;font-size:calc(18px*var(--fs));font-weight:900}
.mt .bar2{height:6px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
.mt .bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:3px}
.mt.sel{outline:3px solid var(--acc)}
.stars-big{display:flex;gap:6px;justify-content:center;margin:6px 0 4px}
.stars-big svg{width:62px;height:62px;fill:#f6b73c;stroke:none;filter:drop-shadow(0 6px 8px rgba(246,183,60,.45));animation:starIn .6s both cubic-bezier(.2,1.4,.4,1)}
.stars-big svg.off{fill:var(--line);filter:none}
.stars-big svg:nth-child(2){animation-delay:.18s}.stars-big svg:nth-child(3){animation-delay:.36s}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:8px 0 6px}
.chip{color:#fff;border-radius:999px;padding:6px 14px;font-size:calc(14px*var(--fs));font-weight:800}
.fun{background:var(--card);border-radius:20px;padding:12px;margin:10px 0;box-shadow:var(--shadow)}.fun p{margin:0 0 4px;font-weight:800}
.how{text-align:left;font-size:calc(16px*var(--fs));line-height:1.5;padding-left:22px;margin:10px 0;font-weight:700}
.how li{margin:6px 0}
.lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:10px 0}
.lv{border-radius:16px;background:var(--card);box-shadow:var(--shadow);padding:8px 0 5px;font-weight:900;font-size:calc(16px*var(--fs))}
.lv i{display:block;font-style:normal;font-size:10px;color:#f6b73c;height:13px;letter-spacing:1px}
.lv.cur{outline:3px solid var(--acc)}
textarea{width:100%;height:230px;border-radius:16px;border:1px solid var(--line);padding:10px;font:13px/1.45 ui-monospace,Consolas,monospace;background:var(--card);color:var(--ink)}
.conf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:40;pointer-events:none;animation:fall 1.8s ease-in forwards}
.ghost{position:fixed;z-index:35;pointer-events:none;margin:0!important}

@media (max-height:720px){
  .top{padding-bottom:4px}.ib{width:42px;height:42px}
  .slots{margin-bottom:8px;gap:7px}
  .slot{min-height:80px;padding:6px 4px;border-radius:16px}
  .slot.empty .sh{margin-top:22px}.slot .sh{margin:1px 0 2px}
  .slots.n5{grid-template-columns:repeat(5,1fr)}
  .slots.n5 .slot,.slots.n5 .slot:nth-child(4),.slots.n5 .slot:nth-child(5){grid-column:auto}
  .card{height:56px;margin-top:-28px;line-height:28px;border-radius:14px}
  .card.p{height:70px;margin-top:-28px}.card.p img{width:40px;height:40px}.card.p .n{margin-top:3px;font-size:11px}
  .empty{height:56px}
  .coach{padding:7px 12px;font-size:calc(14px*var(--fs));margin-bottom:6px;border-radius:14px}
  .bar button{height:52px;border-radius:16px}.bar{padding-top:4px}
}
.card.play{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.card img{-webkit-user-drag:none;user-select:none;pointer-events:none}
.slot .sw[data-top]{touch-action:none;cursor:grab}
.card.dragging{opacity:.22}
.sw.dragging{opacity:.3}
.drag-ghost{position:fixed!important;z-index:60;pointer-events:none;margin:0!important;transform:scale(1.07) rotate(-2deg);box-shadow:0 22px 34px -10px rgba(40,25,60,.55)!important;transition:none!important}
.slot.over{border-color:var(--acc);background:var(--glass-b);box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 30%,transparent);transform:scale(1.03)}
.col.over{outline:2px dashed var(--acc);outline-offset:3px;border-radius:14px}
body.is-dragging{cursor:grabbing}
body.is-dragging *{cursor:grabbing!important}
.card.two{white-space:normal;line-height:15px;padding:5px 4px 0}
.mt .mi.n{background:linear-gradient(145deg,#2f7de1,#58b6f0);font-size:17px}
.mt .mi.d{background:linear-gradient(145deg,#e0803a,#f2b84e);font-size:17px}

/* fit-to-screen scaling: --k scales card size, --ks scales group boxes, --kf scales small text */
:root{--h:64px;--o:32px;--hp:86px;--op:30px;--img:50px;--sh:108px}
@media (max-height:720px){:root{--h:56px;--o:28px;--hp:70px;--op:28px;--img:40px;--sh:80px}}
.card{height:calc(var(--h)*var(--k,1));margin-top:calc(var(--o)*var(--k,1)*-1);line-height:calc(var(--o)*var(--k,1))}
.card.p{height:calc(var(--hp)*var(--k,1));margin-top:calc(var(--op)*var(--k,1)*-1);line-height:1}
.card.p img,.card.p img.ph{width:calc(var(--img)*var(--k,1));height:calc(var(--img)*var(--k,1))}
.card.p .n{font-size:calc(12px*var(--fs)*var(--kf,1))}
.card.two{line-height:calc(15px*var(--kf,1))}
.empty{height:calc(var(--h)*var(--k,1))}
.card.p.s svg{width:calc(54px*var(--k,1));height:calc(49px*var(--k,1))}
.card.gcard{height:calc(66px*var(--k,1))}
.card.p.gcard{height:calc(92px*var(--k,1))}
.card.p.gcard img,.card.p.gcard img.ph{width:calc(56px*var(--k,1));height:calc(56px*var(--k,1))}
.card.p.gcard svg{width:calc(60px*var(--k,1));height:calc(55px*var(--k,1))}
.slot{min-height:calc(var(--sh)*var(--ks,1))}
.slot .sh{font-size:calc(12px*var(--fs)*var(--ks,1))}
.slot .sw{font-size:calc(14px*var(--fs)*var(--ks,1))}
.slot.done .sh{font-size:calc(15px*var(--fs)*var(--ks,1))}
.slot.band{min-height:0}
